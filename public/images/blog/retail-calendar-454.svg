<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 494" width="960" height="494" role="img" aria-label="The 52 weeks of a retail year in four rows, one per quarter. Each quarter holds thirteen weeks split into months of four, five and four weeks: February four, March five, April four, and the same pattern in each later quarter. An extra 53rd week is shown with a dashed outline after week 52.">
<rect width="960" height="494" fill="#faf8f4"/>
<text x="40" y="38" font-family="Inter Tight, Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#17181c">One retail year: four quarters of thirteen weeks</text>
